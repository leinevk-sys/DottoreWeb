<title>GENERIC CAM // Ants That Died Alone</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #041626;
    font-family: 'Courier New', Courier, monospace;
    color: #FFFFFF;
  }

  /* Атмосферный фон сверху и снизу в духе загруженного арта */
  #ambient-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 22% 14%, rgba(0, 175, 225, 0.58) 0%, transparent 46%),
      radial-gradient(ellipse at 78% 18%, rgba(8, 120, 175, 0.52) 0%, transparent 50%),
      radial-gradient(ellipse at 32% 86%, rgba(215, 28, 48, 0.56) 0%, transparent 45%),
      radial-gradient(ellipse at 76% 84%, rgba(0, 155, 205, 0.48) 0%, transparent 50%),
      linear-gradient(180deg, #051B2E 0%, #093554 24%, #061322 50%, #072842 76%, #140712 100%);
  }

  #ambient-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        104deg,
        rgba(255, 255, 255, 0.045) 0px,
        rgba(255, 255, 255, 0.045) 1px,
        transparent 1px,
        transparent 14px
      ),
      repeating-linear-gradient(
        -12deg,
        rgba(235, 32, 55, 0.085) 0px,
        rgba(235, 32, 55, 0.085) 2px,
        transparent 2px,
        transparent 26px
      );
    pointer-events: none;
  }

  #stage-frame {
    position: relative;
    z-index: 2;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }

  /* Прямоугольник игры немного увеличен ввысь */
  #game-box {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 3 / 2;
    max-height: 82vh;
    background: #05070E;
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.72);
    overflow: visible;
  }

  canvas#c {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }

  canvas#glitchEdgeCanvas {
    position: absolute;
    top: -18px;
    left: -18px;
    width: calc(100% + 36px);
    height: calc(100% + 36px);
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>

<div id="stage-frame">

    <canvas id="c" width="960" height="640"></canvas>

  </div>
</div>

const imgs = {};
let loaded = 0;
const total = Object.keys(ASSETS).length;

for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image();
  im.onload = () => {
    loaded++;
    if (loaded === total) requestAnimationFrame(loop);
  };
  im.src = src;
  imgs[k] = im;
}

let audioCtx = null;
function playPopGoo(kills) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(125, now);
    osc.frequency.exponentialRampToValueAtTime(26, now + 0.18);
    g.gain.setValueAtTime(0.38, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);

    if (kills > 0) {
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.type = "sawtooth";
      osc2.frequency.setValueAtTime(260 + Math.min(kills, 10) * 35, now + 0.01);
      osc2.frequency.exponentialRampToValueAtTime(75, now + 0.14);
      g2.gain.setValueAtTime(0.11, now + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc2.connect(g2);
      g2.connect(audioCtx.destination);
      osc2.start(now + 0.01);
      osc2.stop(now + 0.15);
    }
  } catch (e) {}
}

const state = {
  sec: 56,
  secAcc: 0,
  kills: 199,
  deltaKills: 0,
  deltaTimer: 0,
  deltaText: "Ants that Died Alone",
  wave: 62,
  waveAcc: 0,
  combo: 0,
  comboTimer: 0,
  pressure: 0.72,
  laughTimer: 0,
  shakeTimer: 0,
  glitchBoostTimer: 0,
  pointerX: 310,
  pointerY: 300,
  holding: false,
  bootX: 310,
  bootY: 295,
  bootVy: 0,
  bootMode: "hover",
  groundedTimer: 0,
  fixedBackX: 545,
  fixedBackY: 570,
  backPose: 2,
  ants: [],
  floats: [],
  particles: [],
  gooDrips: [],
  edgeBlocks: []
};

const GLITCH_COLORS = [
  "#00E5FF",
  "#FF2A55",
  "#3A86FF",
  "#FFBE0B",
  "#06D6A0",
  "#B5179E",
  "#FFFFFF"
];

function refreshEdgeGlitchBlocks() {
  const gw = glitchCanvas.width;
  const gh = glitchCanvas.height;
  const margin = 18;
  const innerW = gw - margin * 2;
  const innerH = gh - margin * 2;
  const count = state.glitchBoostTimer > 0 ? 34 : 18;
  const blocks = [];

  for (let i = 0; i < count; i++) {
    const side = i % 4;
    const bw = 6 + Math.floor(Math.random() * 24);
    const bh = 4 + Math.floor(Math.random() * 14);
    let x = 0, y = 0;

    if (side === 0) {
      x = margin + Math.random() * Math.max(1, innerW - bw);
      y = margin - bh * 0.5 + (Math.random() * 16 - 8);
    } else if (side === 1) {
      x = margin + Math.random() * Math.max(1, innerW - bw);
      y = margin + innerH - bh * 0.5 + (Math.random() * 16 - 8);
    } else if (side === 2) {
      x = margin - bw * 0.5 + (Math.random() * 14 - 7);
      y = margin + Math.random() * Math.max(1, innerH - bh);
    } else {
      x = margin + innerW - bw * 0.5 + (Math.random() * 14 - 7);
      y = margin + Math.random() * Math.max(1, innerH - bh);
    }

    blocks.push({
      x: Math.round(x),
      y: Math.round(y),
      w: bw,
      h: bh,
      color: GLITCH_COLORS[Math.floor(Math.random() * GLITCH_COLORS.length)],
      alpha: 0.45 + Math.random() * 0.5
    });
  }
  state.edgeBlocks = blocks;
}

let glitchTickAcc = 0;
function drawEdgeGlitches(dt) {
  glitchTickAcc += dt;
  const interval = state.glitchBoostTimer > 0 ? 0.055 : 0.14;
  if (glitchTickAcc >= interval) {
    glitchTickAcc = 0;
    refreshEdgeGlitchBlocks();
  }

  gctx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);
  for (const b of state.edgeBlocks) {
    gctx.save();
    gctx.globalAlpha = b.alpha;
    gctx.fillStyle = b.color;
    gctx.fillRect(b.x, b.y, b.w, b.h);
    gctx.restore();
  }
}

function spawnAnt(side = null) {
  const dir = side !== null ? side : (Math.random() < 0.5 ? 1 : -1);
  state.ants.push({
    x: dir === 1 ? -24 : W + 24,
    dir,
    speed: 36 + Math.random() * 54,
    phase: Math.random() * 6.28,
    isTrash: Math.random() < 0.3,
    panic: 0
  });
}

for (let i = 0; i < 24; i++) {
  spawnAnt();
  state.ants[state.ants.length - 1].x = Math.random() * W;
}

function toCanvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((clientX - r.left) / r.width) * W,
    y: ((clientY - r.top) / r.height) * H
  };
}

canvas.addEventListener("pointerdown", (e) => {
  const p = toCanvasPos(e.clientX, e.clientY);
  state.holding = true;
  state.pointerX = Math.max(150, Math.min(W - 210, p.x));
  state.pointerY = p.y;
  if (state.bootMode === "hover" || state.bootMode === "lift") {
    state.bootMode = "slam";
    state.bootVy = 2250;
  }
});

canvas.addEventListener("pointermove", (e) => {
  const p = toCanvasPos(e.clientX, e.clientY);
  state.pointerX = Math.max(150, Math.min(W - 210, p.x));
  state.pointerY = p.y;
});

window.addEventListener("pointerup", () => {
  state.holding = false;
});

function onImpact() {
  const bx = state.bootX;
  const left = bx - 170;
  const right = bx + 140;
  let crushed = 0;
  let trash = 0;
  let ptsSum = 0;

  for (let i = state.ants.length - 1; i >= 0; i--) {
    const a = state.ants[i];
    if (a.x >= left && a.x <= right) {
      crushed++;
      if (a.isTrash) trash++;
      const pts = 5 + Math.floor(Math.random() * 5);
      ptsSum += pts;
      state.floats.push({
        x: a.x + (Math.random() * 24 - 12),
        y: GROUND_Y - 26 - Math.random() * 38,
        text: `+${pts}`,
        color: Math.random() > 0.2 ? "#4EA8DE" : "#7EE787",
        life: 0.95
      });

      for (let k = 0; k < 10; k++) {
        state.particles.push({
          x: a.x + (Math.random() * 16 - 8),
          y: GROUND_Y - 12 - Math.random() * 14,
          vx: (Math.random() - 0.5) * 290,
          vy: -80 - Math.random() * 210,
          w: 5 + Math.floor(Math.random() * 7),
          h: 5 + Math.floor(Math.random() * 7),
          sticky: k % 2 === 0,
          life: 0.95
        });
      }

      const relX = Math.max(-135, Math.min(115, a.x - bx));
      state.gooDrips.push({
        relX,
        offsetY: -8 - Math.random() * 24,
        length: 12 + Math.random() * 18,
        width: 6 + Math.random() * 7,
        dripSpeed: 10 + Math.random() * 12,
        life: 2.2
      });
      if (state.gooDrips.length > 26) state.gooDrips.shift();

      state.ants.splice(i, 1);
    } else if (Math.abs(a.x - bx) < 230) {
      a.dir = a.x < bx ? -1 : 1;
      a.panic = 1.4;
    }
  }

  state.backPose = (state.backPose % 3) + 1;

  state.shakeTimer = 0.22;
  state.glitchBoostTimer = 0.35;
  state.pressure = Math.min(1.0, state.pressure + 0.16);
  playPopGoo(crushed);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("heavy");

  if (crushed > 0) {
    state.kills += crushed;
    state.deltaKills = crushed;
    state.deltaTimer = 1.8;
    state.deltaText = trash > 0 ? "Trash Taken Out" : "Ants that Died Alone";
    state.combo += ptsSum;
    state.comboTimer = 2.2;
    state.laughTimer = 1.25;
  }
}

let prev = performance.now();
function update(dt) {
  state.secAcc += dt;
  if (state.secAcc >= 1) {
    state.sec += Math.floor(state.secAcc);
    state.secAcc %= 1;
  }
  state.waveAcc += dt;
  if (state.waveAcc >= 2.2) {
    state.waveAcc = 0;
    state.wave++;
  }

  if (state.ants.length < 30 && Math.random() < dt * 7.5) spawnAnt();

  state.bootX += (state.pointerX - state.bootX) * Math.min(1, dt * 15);

  if (state.bootMode === "hover") {
    const targetY = 300 + Math.sin(performance.now() * 0.0055) * 10;
    state.bootY += (targetY - state.bootY) * Math.min(1, dt * 10);
  } else if (state.bootMode === "slam") {
    state.bootY += state.bootVy * dt;
    if (state.bootY >= GROUND_Y) {
      state.bootY = GROUND_Y;
      state.bootMode = "grounded";
      state.groundedTimer = 0.28;
      onImpact();
    }
  } else if (state.bootMode === "grounded") {
    state.groundedTimer -= dt;
    if (state.groundedTimer <= 0 && !state.holding) {
      state.bootMode = "lift";
    }
  } else if (state.bootMode === "lift") {
    state.bootY -= 940 * dt;
    if (state.bootY <= 300) {
      state.bootY = 300;
      state.bootMode = "hover";
    }
  }

  for (let i = state.ants.length - 1; i >= 0; i--) {
    const a = state.ants[i];
    if (a.panic > 0) a.panic -= dt;
    const mult = a.panic > 0 ? 2.1 : 1.0;
    a.x += a.dir * a.speed * mult * dt;
    a.phase += dt * 18 * mult;
    if (a.x < -55 || a.x > W + 55) state.ants.splice(i, 1);
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    if (p.sticky && p.y < state.bootY - 4) {
      p.x += (state.bootX - state.pointerX) * 0.25;
      p.y += 18 * dt;
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 650 * dt;
      if (p.y >= GROUND_Y - 2) {
        p.y = GROUND_Y - 2;
        p.vx *= 0.4;
        p.vy = 0;
      }
    }
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  for (let i = state.gooDrips.length - 1; i >= 0; i--) {
    const g = state.gooDrips[i];
    g.length += g.dripSpeed * dt;
    g.life -= dt;
    if (g.life <= 0) state.gooDrips.splice(i, 1);
  }

  for (let i = state.floats.length - 1; i >= 0; i--) {
    const f = state.floats[i];
    f.y -= 42 * dt;
    f.life -= dt;
    if (f.life <= 0) state.floats.splice(i, 1);
  }

  if (state.deltaTimer > 0) state.deltaTimer -= dt;
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 0;
  }
  if (state.shakeTimer > 0) state.shakeTimer -= dt;
  if (state.glitchBoostTimer > 0) state.glitchBoostTimer -= dt;
  if (state.laughTimer > 0) state.laughTimer -= dt;
  state.pressure = Math.max(0.25, state.pressure - dt * 0.14);
}

function drawHUD() {
  const hh = String(Math.floor(state.sec / 3600)).padStart(2, "0");
  const mm = String(Math.floor((state.sec % 3600) / 60)).padStart(2, "0");
  const ss = String(state.sec % 60).padStart(2, "0");

  ctx.font = "bold 22px Courier New";
  ctx.fillStyle = "#060810";
  ctx.fillText(`${hh}:${mm}:${ss}`, 64, 42);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(`${hh}:${mm}:${ss}`, 62, 40);

  ctx.fillStyle = "#E2F1FF";
  ctx.fillRect(202, 24, 16, 14);
  ctx.fillStyle = "#060810";
  ctx.fillRect(205, 28, 3, 3);
  ctx.fillRect(212, 28, 3, 3);
  ctx.strokeStyle = "#E2F1FF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(210, 19, 11, 3, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#060810";
  ctx.fillText(String(state.kills), 232, 42);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(String(state.kills), 230, 40);

  if (state.deltaTimer > 0 && state.deltaKills > 0) {
    const kw = ctx.measureText(String(state.kills)).width;
    ctx.fillStyle = "#060810";
    ctx.fillText(`+${state.deltaKills}`, 238 + kw, 42);
    ctx.fillStyle = "#FF5C77";
    ctx.fillText(`+${state.deltaKills}`, 236 + kw, 40);

    ctx.font = "bold 20px Courier New";
    ctx.fillStyle = "#060810";
    ctx.fillText(`+${state.deltaKills} ${state.deltaText}`, 64, 74);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(`+${state.deltaKills} ${state.deltaText}`, 62, 72);
  }

  ctx.font = "bold 22px Courier New";
  ctx.fillStyle = "#E2F1FF";
  ctx.fillRect(354, 24, 10, 14);
  ctx.fillStyle = "#060810";
  ctx.fillText(String(state.wave), 382, 42);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(String(state.wave), 380, 40);

  ctx.save();
  ctx.translate(28, 455);
  ctx.rotate(-Math.PI / 2);
  ctx.font = "bold 15px Courier New";
  ctx.fillStyle = "#7BA4D4";
  ctx.fillText("PRESSURE", 0, 0);
  ctx.restore();

  const camImg = state.laughTimer > 0 ? imgs.cam2 : imgs.cam1;
  ctx.drawImage(camImg, 702, 8);

  const dotsY = 312;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(744 + i * 25, dotsY, 8, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? "#FFFFFF" : "#0B1324";
    ctx.fill();
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 2;
  ctx.strokeRect(896, dotsY - 8, 36, 16);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(932, dotsY - 4, 4, 8);
  ctx.fillRect(900, dotsY - 4, 8, 8);
  ctx.fillRect(910, dotsY - 4, 8, 8);

  if (state.combo > 0) {
    ctx.font = "bold 20px Courier New";
    ctx.fillStyle = "#060810";
    ctx.fillText(`+${state.combo}`, 874, dotsY + 34);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(`+${state.combo}`, 872, dotsY + 32);
  }

  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(Math.round(state.pointerX), Math.round(state.pointerY), 7, 0, Math.PI * 2);
  ctx.stroke();
}

function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  update(dt);

  ctx.save();
  if (state.shakeTimer > 0) {
    ctx.translate(Math.round((Math.random() - 0.5) * 10), Math.round((Math.random() - 0.5) * 10));
  }

  ctx.drawImage(imgs.bg, 0, 0, W, H);

  const backImg = state.backPose === 1 ? imgs.back1 : (state.backPose === 2 ? imgs.back2 : imgs.back3);
  ctx.drawImage(backImg, Math.round(state.fixedBackX - 130), Math.round(state.fixedBackY - backImg.height));

  for (const a of state.ants) {
    const bob = Math.sin(a.phase) * 2.5;
    ctx.save();
    ctx.translate(Math.round(a.x), Math.round(GROUND_Y - 22 + bob));
    if (a.dir === -1) ctx.scale(-1, 1);
    ctx.drawImage(imgs.ant, -22, -24, 44, 48);
    ctx.restore();
  }

  let activeBoot = imgs.bootFlat;
  if (state.bootY < GROUND_Y - 140) {
    activeBoot = imgs.bootUp;
  } else if (state.bootY < GROUND_Y - 18) {
    activeBoot = imgs.bootTilt;
  }
  ctx.drawImage(activeBoot, Math.round(state.bootX - 175), Math.round(state.bootY - activeBoot.height));

  for (const g of state.gooDrips) {
    const gx = Math.round(state.bootX + g.relX);
    const gy = Math.round(state.bootY + g.offsetY);
    ctx.fillStyle = "#05060A";
    ctx.fillRect(gx, gy, Math.round(g.width), Math.round(g.length));
    ctx.fillStyle = "#1E293B";
    ctx.fillRect(gx + 1, gy + 2, 2, Math.max(2, Math.round(g.length * 0.55)));
  }

  for (const p of state.particles) {
    ctx.fillStyle = "#05060A";
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h);
    ctx.fillStyle = "#24344D";
    ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, 2, 2);
  }
  ctx.font = "bold 18px Courier New";
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = "#05070E";
    ctx.fillText(f.text, Math.round(f.x) + 1, Math.round(f.y) + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
  }
  ctx.globalAlpha = 1;

  drawHUD();
  ctx.restore();

  drawEdgeGlitches(dt);
  requestAnimationFrame(loop);
}
</script>
