<title>GENERIC CAM // Ants That Died Alone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #041626;
    font-family: 'Courier New', Courier, monospace;
    color: #FFFFFF;
  }

  /* Атмосферный фон сверху и снизу в духе загруженного арта */
  #ambient-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 22% 14%, rgba(0, 175, 225, 0.58) 0%, transparent 46%),
      radial-gradient(ellipse at 78% 18%, rgba(8, 120, 175, 0.52) 0%, transparent 50%),
      radial-gradient(ellipse at 32% 86%, rgba(215, 28, 48, 0.56) 0%, transparent 45%),
      radial-gradient(ellipse at 76% 84%, rgba(0, 155, 205, 0.48) 0%, transparent 50%),
      linear-gradient(180deg, #051B2E 0%, #093554 24%, #061322 50%, #072842 76%, #140712 100%);
  }

  #ambient-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        104deg,
        rgba(255, 255, 255, 0.045) 0px,
        rgba(255, 255, 255, 0.045) 1px,
        transparent 1px,
        transparent 14px
      ),
      repeating-linear-gradient(
        -12deg,
        rgba(235, 32, 55, 0.085) 0px,
        rgba(235, 32, 55, 0.085) 2px,
        transparent 2px,
        transparent 26px
      );
    pointer-events: none;
  }

  #stage-frame {
    position: relative;
    z-index: 2;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }

  /* Прямоугольник игры немного увеличен ввысь */
  #game-box {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 3 / 2;
    max-height: 82vh;
    background: #05070E;
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.72);
    overflow: visible;
  }

  canvas#c {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }

  canvas#glitchEdgeCanvas {
    position: absolute;
    top: -18px;
    left: -18px;
    width: calc(100% + 36px);
    height: calc(100% + 36px);
    pointer-events: none;
    z-index: 5;
  }
</style>

<div id="ambient-bg"></div>
<div id="stage-frame">
  <div id="game-box">
    <canvas id="c" width="960" height="640"></canvas>
    <canvas id="glitchEdgeCanvas"></canvas>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.expand();
  tg.ready();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

const STORAGE_KEY = "DOTTORE_GAME_STATE_V1";

const defaultGameState = {
  score: 0,
  bestScore: 0,
  level: 1,
  updatedAt: null
};

function loadGameState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...defaultGameState };
    const parsed = JSON.parse(raw);
    return {
      ...defaultGameState,
      ...(parsed && typeof parsed === "object" ? parsed : {})
    };
  } catch (_) {
    return { ...defaultGameState };
  }
}

function saveGameState(nextState) {
  try {
    const merged = {
      ...loadGameState(),
      ...nextState,
      updatedAt: new Date().toISOString()
    };
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    return merged;
  } catch (_) {
    return nextState;
  }
}

function submitGamePayloadToBot(extraPayload = {}) {
  const current = loadGameState();
  const payload = JSON.stringify({
    ...current,
    ...extraPayload,
    sentAt: new Date().toISOString()
  });

  if (tg && typeof tg.sendData === "function" && tg.initData) {
    try {
      tg.sendData(payload);
      window.localStorage.removeItem(STORAGE_KEY);
      return true;
    } catch (_) {
      return false;
    }
  }
  return false;
}

let gameState = loadGameState();
window.addEventListener("pagehide", () => saveGameState(gameState));
window.addEventListener("beforeunload", () => saveGameState(gameState));
